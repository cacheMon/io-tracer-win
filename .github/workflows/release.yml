name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions: write-all
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Install Velopack
      run: dotnet tool install -g vpk
    
    - name: Extract version from tag
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart('v')
        
        # Ensure version has 3 parts (MAJOR.MINOR.PATCH)
        $parts = $version.Split('.')
        if ($parts.Length -eq 2) {
          $version = "$version.0"
        } elseif ($parts.Length -eq 1) {
          $version = "$version.0.0"
        }
        
        Write-Host "Extracted version: $version"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
    
    - name: Update version in csproj
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        Write-Host "Setting version to: $version"
        
        $csprojPath = ".\IOTracesCORE\IOTracesCORE.csproj"
        $content = Get-Content $csprojPath -Raw
        $content = $content -replace '<Version>[\d\.]+</Version>', "<Version>$version</Version>"
        Set-Content $csprojPath $content
        
        Write-Host "Updated csproj content:"
        Get-Content $csprojPath | Select-String -Pattern '<Version>'
      shell: pwsh
    
    - name: Restore dependencies
      run: dotnet restore .\IOTracesCORE\IOTracesCORE.csproj
    
    - name: Build
      run: |
        dotnet publish .\IOTracesCORE\IOTracesCORE.csproj `
          -c Release `
          -r win-x64 `
          --self-contained `
          -p:PublishSingleFile=false `
          -p:IncludeNativeLibrariesForSelfExtract=true
      shell: pwsh
    
    - name: Verify build output
      run: |
        $publishDir = ".\IOTracesCORE\bin\Release\net8.0-windows\win-x64\publish"
        if (Test-Path $publishDir) {
          Write-Host "Build output exists"
          Get-ChildItem $publishDir | Select-Object Name
        } else {
          Write-Host "ERROR: Build output directory not found!"
          exit 1
        }
      shell: pwsh

    - name: Create ZIP package
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $publishDir = ".\IOTracesCORE\bin\Release\net8.0-windows\win-x64\publish"
        $zipPath = ".\IOTracer-v$version-portable.zip"
        
        Compress-Archive -Path "$publishDir\*" -DestinationPath $zipPath
        Write-Host "Created portable ZIP: $zipPath"
      shell: pwsh
    
    - name: Create ZIP of Velopack installer
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $releasesDir = ".\Releases"
        $zipPath = ".\IOTracer-v$version-installer.zip"
        
        if (Test-Path $releasesDir) {
          Write-Host "Contents of Releases folder:"
          Get-ChildItem $releasesDir | Select-Object Name
          
          Compress-Archive -Path "$releasesDir\*" -DestinationPath $zipPath
          Write-Host "Created installer ZIP: $zipPath"
        } else {
          Write-Host "ERROR: Releases directory not found!"
          exit 1
        }
      shell: pwsh

    - name: Upload to GitHub Release
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        
        vpk upload github `
          --repoUrl https://github.com/${{ github.repository }} `
          --publish `
          --releaseName "IO Tracer $version" `
          --tag $version `
          --token ${{ secrets.GITHUB_TOKEN }}
        
        # Upload the ZIP as well
        gh release upload $version IOTracer-v$version-installer.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
