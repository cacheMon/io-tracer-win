name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Install Velopack
      run: dotnet tool install -g vpk
    
    - name: Extract version from tag
      id: version
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
    
    - name: Update version in csproj
      run: |
        $content = Get-Content .\IOTracesCORE\IOTracesCORE.csproj
        $content = $content -replace '<Version>.*</Version>', "<Version>${{ steps.version.outputs.VERSION }}</Version>"
        Set-Content .\IOTracesCORE\IOTracesCORE.csproj $content
      shell: pwsh
    
    - name: Build
      run: |
        dotnet publish .\IOTracesCORE\IOTracesCORE.csproj `
          -c Release `
          -r win-x64 `
          --self-contained `
          -p:PublishSingleFile=false
      shell: pwsh
    
    - name: Package with Velopack
      run: |
        vpk pack `
          --packId IOTracesCore `
          --packVersion ${{ steps.version.outputs.VERSION }} `
          --packDir .\IOTracesCORE\bin\Release\net8.0-windows\win-x64\publish `
          --mainExe IOTracesCORE.exe `
          --packTitle "IO Traces Core" `
          --icon .\IOTracesCORE\Opera_Glasses_icon-icons.com_54155.ico
      shell: pwsh
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Releases/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
